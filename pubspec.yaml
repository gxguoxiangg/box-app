name: demo1
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.1
  file_saver: ^0.4.0
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.7+1
  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0
  http: ^1.6.0
  image_picker: ^1.2.3
  network_info_plus: ^8.2.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  super_editor: ^0.3.0-dev.52
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - resource/images/atom.png
  fonts:
    - family: ShadowsIntoLight
      fonts:
        - asset: resource/font/ShadowsIntoLight-Regular.ttf
    - family: KaushanScript
      fonts:
        - asset: resource/font/KaushanScript-Regular.ttf
    - family: Rye-Regular
      fonts:
       - asset: resource/font/Rye-Regular.ttf
    - family: IMFellEnglishSC-Regular
      fonts:
       - asset: resource/font/IMFellEnglishSC-Regular.ttf
    - family: StardosStencil-Regular
      fonts:
       - asset: resource/font/StardosStencil-Regular.ttf
